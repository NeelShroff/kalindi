version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kalindi_user
      POSTGRES_PASSWORD: kalindi_password
      POSTGRES_DB: kalindi_db
    # ports:
    #   # Expose only to host loopback interface (security best practice)
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
    ports:
      # Expose only to host loopback interface
      - "127.0.0.1:8088:8088"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://kalindi_user:kalindi_password@postgres:5432/kalindi_db
      - PORT=8088
    volumes:
      - ./backend/static/uploads:/app/static/uploads
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${API_URL}
        - NEXT_PUBLIC_RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    ports:
      # Expose only to host loopback interface
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount host's Let's Encrypt folder directly for easy SSL sharing
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  pgdata:


